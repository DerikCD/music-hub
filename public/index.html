<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>SoundWave - Music Platform</title>
  <link href="https://fonts.googleapis.com/css2?family=Outfit:wght@300;400;600;700;800&family=Montserrat:wght@400;500;600;700&display=swap" rel="stylesheet">
  <style>
    * {
      margin: 0;
      padding: 0;
      box-sizing: border-box;
    }

    body {
      font-family: 'Outfit', sans-serif;
      background: #0f0f0f;
      color: #fff;
      min-height: 100vh;
    }

    .wrapper {
      display: flex;
      min-height: 100vh;
    }

    .sidebar {
      width: 250px;
      background: linear-gradient(135deg, #1a1a2e 0%, #16213e 100%);
      padding: 2rem 1.5rem;
      border-right: 1px solid rgba(255, 255, 255, 0.1);
      position: fixed;
      height: 100vh;
      overflow-y: auto;
    }

    .logo {
      font-size: 1.8rem;
      font-weight: 800;
      margin-bottom: 2rem;
      background: linear-gradient(135deg, #00d4ff 0%, #0099ff 100%);
      -webkit-background-clip: text;
      -webkit-text-fill-color: transparent;
      background-clip: text;
      letter-spacing: -0.5px;
    }

    .nav {
      display: flex;
      flex-direction: column;
      gap: 0.5rem;
    }

    .nav-item {
      padding: 0.75rem 1rem;
      border-radius: 8px;
      cursor: pointer;
      font-weight: 500;
      transition: all 0.3s ease;
      color: #b3b3b3;
      border: none;
      background: transparent;
      text-align: left;
      width: 100%;
      font-family: 'Outfit', sans-serif;
      font-size: 0.95rem;
    }

    .nav-item:hover {
      color: #fff;
      background: rgba(0, 212, 255, 0.1);
    }

    .nav-item.active {
      background: linear-gradient(135deg, #00d4ff 0%, #0099ff 100%);
      color: #000;
      font-weight: 600;
    }

    .main {
      margin-left: 250px;
      flex: 1;
      background: linear-gradient(to bottom, #0f0f0f 0%, #1a1a2e 100%);
      min-height: 100vh;
      overflow-y: auto;
    }

    .header {
      padding: 2rem;
      background: rgba(0, 0, 0, 0.4);
      backdrop-filter: blur(10px);
      border-bottom: 1px solid rgba(255, 255, 255, 0.1);
      position: sticky;
      top: 0;
      z-index: 100;
    }

    .header h1 {
      font-size: 2.5rem;
      font-weight: 800;
      margin-bottom: 0.5rem;
      letter-spacing: -1px;
    }

    .header p {
      color: #b3b3b3;
      font-size: 0.95rem;
      font-weight: 400;
    }

    .content {
      padding: 2rem;
      max-width: 1400px;
    }

    .search-container {
      margin-bottom: 2rem;
    }

    .search-bar {
      width: 100%;
      padding: 1rem;
      background: rgba(255, 255, 255, 0.1);
      border: 1px solid rgba(255, 255, 255, 0.2);
      border-radius: 24px;
      color: #fff;
      font-family: 'Outfit', sans-serif;
      font-size: 0.95rem;
      transition: all 0.3s ease;
    }

    .search-bar::placeholder {
      color: #666;
    }

    .search-bar:focus {
      outline: none;
      background: rgba(255, 255, 255, 0.15);
      border-color: rgba(0, 212, 255, 0.5);
      box-shadow: 0 0 20px rgba(0, 212, 255, 0.2);
    }

    .section {
      display: none;
      animation: fadeIn 0.3s ease;
    }

    .section.active {
      display: block;
    }

    @keyframes fadeIn {
      from { opacity: 0; }
      to { opacity: 1; }
    }

    .section-title {
      font-size: 1.8rem;
      font-weight: 700;
      margin-bottom: 1.5rem;
      letter-spacing: -0.5px;
    }

    .upload-form {
      background: rgba(255, 255, 255, 0.05);
      padding: 2rem;
      border-radius: 12px;
      border: 1px solid rgba(255, 255, 255, 0.1);
      max-width: 500px;
    }

    .form-group {
      display: flex;
      flex-direction: column;
      gap: 1rem;
      margin-bottom: 1rem;
    }

    input[type="text"],
    input[type="file"],
    input[type="search"] {
      padding: 0.875rem;
      background: rgba(255, 255, 255, 0.08);
      border: 1px solid rgba(255, 255, 255, 0.15);
      border-radius: 8px;
      color: #fff;
      font-family: 'Outfit', sans-serif;
      font-size: 0.95rem;
      transition: all 0.3s ease;
    }

    input[type="text"]::placeholder,
    input[type="search"]::placeholder {
      color: #666;
    }

    input[type="text"]:focus,
    input[type="file"]:focus,
    input[type="search"]:focus {
      outline: none;
      background: rgba(255, 255, 255, 0.12);
      border-color: rgba(0, 212, 255, 0.5);
    }

    button {
      padding: 0.875rem 1.75rem;
      background: linear-gradient(135deg, #00d4ff 0%, #0099ff 100%);
      color: #000;
      border: none;
      border-radius: 24px;
      font-weight: 600;
      font-family: 'Outfit', sans-serif;
      cursor: pointer;
      transition: all 0.3s ease;
      font-size: 0.95rem;
    }

    button:hover {
      transform: scale(1.05);
      box-shadow: 0 8px 24px rgba(0, 212, 255, 0.3);
    }

    button:disabled {
      opacity: 0.6;
      cursor: not-allowed;
      transform: none;
    }

    .tracks-grid {
      display: grid;
      grid-template-columns: repeat(auto-fill, minmax(280px, 1fr));
      gap: 1.5rem;
    }

    .track-card {
      background: rgba(255, 255, 255, 0.05);
      border: 1px solid rgba(255, 255, 255, 0.1);
      border-radius: 12px;
      padding: 1.5rem;
      transition: all 0.3s ease;
      cursor: pointer;
    }

    .track-card:hover {
      background: rgba(255, 255, 255, 0.08);
      border-color: rgba(0, 212, 255, 0.5);
      transform: translateY(-4px);
      box-shadow: 0 12px 24px rgba(0, 212, 255, 0.15);
    }

    .track-card.list-view {
      display: flex;
      justify-content: space-between;
      align-items: center;
      grid-column: 1 / -1;
    }

    .track-info {
      flex: 1;
    }

    .track-title {
      font-size: 1.1rem;
      font-weight: 600;
      margin-bottom: 0.5rem;
      color: #fff;
    }

    .track-artist {
      font-size: 0.9rem;
      color: #b3b3b3;
      margin-bottom: 0.5rem;
    }

    .track-meta {
      font-size: 0.8rem;
      color: #666;
    }

    .track-actions {
      display: flex;
      gap: 0.5rem;
      margin-top: 1rem;
      flex-wrap: wrap;
    }

    .btn-small {
      padding: 0.5rem 1rem;
      font-size: 0.8rem;
      border-radius: 20px;
      font-weight: 600;
      border: none;
      cursor: pointer;
      transition: all 0.3s ease;
      background: rgba(0, 212, 255, 0.2);
      color: #00d4ff;
      font-family: 'Outfit', sans-serif;
    }

    .btn-small:hover {
      background: rgba(0, 212, 255, 0.3);
    }

    .btn-favorite {
      background: rgba(255, 107, 107, 0.2);
      color: #ff6b6b;
    }

    .btn-favorite.liked {
      background: rgba(255, 107, 107, 0.4);
    }

    .btn-delete {
      background: rgba(255, 107, 107, 0.2);
      color: #ff6b6b;
    }

    .player {
      background: rgba(0, 212, 255, 0.1);
      border: 1px solid rgba(0, 212, 255, 0.3);
      padding: 1.5rem;
      border-radius: 12px;
      margin-bottom: 2rem;
      backdrop-filter: blur(10px);
    }

    .player h3 {
      font-size: 1.4rem;
      margin-bottom: 0.5rem;
      color: #00d4ff;
    }

    audio {
      width: 100%;
      margin: 1rem 0;
      accent-color: #00d4ff;
    }

    .player-controls {
      display: flex;
      gap: 0.75rem;
      margin: 1rem 0;
      flex-wrap: wrap;
      align-items: center;
    }

    .empty-state {
      text-align: center;
      padding: 3rem;
      color: #666;
    }

    .empty-state p {
      font-size: 1rem;
    }

    .playlist-item {
      background: rgba(255, 255, 255, 0.05);
      padding: 1rem;
      border-radius: 8px;
      margin-bottom: 0.75rem;
      border: 1px solid rgba(255, 255, 255, 0.1);
      display: flex;
      justify-content: space-between;
      align-items: center;
      transition: all 0.3s ease;
    }

    .playlist-item:hover {
      background: rgba(255, 255, 255, 0.08);
      border-color: rgba(0, 212, 255, 0.3);
    }

    .playlist-name {
      font-weight: 600;
    }

    @media (max-width: 768px) {
      .sidebar {
        width: 0;
        padding: 0;
        position: absolute;
        height: auto;
        transform: translateX(-100%);
      }

      .main {
        margin-left: 0;
      }

      .header h1 {
        font-size: 1.8rem;
      }

      .tracks-grid {
        grid-template-columns: 1fr;
      }
    }
  </style>
</head>
<body>
  <div class="wrapper">
    <div class="sidebar">
      <div class="logo">♫ SoundWave</div>
      <div class="nav">
        <button class="nav-item active" onclick="switchTab('home')">🏠 Home</button>
        <button class="nav-item" onclick="switchTab('library')">📚 Library</button>
        <button class="nav-item" onclick="switchTab('favorites')">❤️ Liked</button>
        <button class="nav-item" onclick="switchTab('recent')">🕐 Recent</button>
        <button class="nav-item" onclick="switchTab('popular')">🔥 Trending</button>
        <button class="nav-item" onclick="switchTab('playlists')">🎵 Playlists</button>
        <button class="nav-item" onclick="switchTab('queue')">📋 Queue</button>
      </div>
    </div>

    <div class="main">
      <div class="header">
        <h1>♫ SoundWave</h1>
        <p>Your personal music platform</p>
      </div>

      <div class="content">
        <!-- Home Section -->
        <div id="home" class="section active">
          <div class="section-title">Welcome to SoundWave</div>
          <div class="upload-form">
            <h2 style="margin-bottom: 1.5rem; font-size: 1.3rem;">Upload Your Track</h2>
            <div class="form-group">
              <input type="text" id="artist" placeholder="Artist name">
              <input type="text" id="title" placeholder="Track title">
              <input type="text" id="genre" placeholder="Genre (Pop, Rock, Hip-Hop, etc.)">
              <input type="file" id="file" accept="audio/*,video/*">
              <button id="uploadBtn" style="width: 100%;">Upload</button>
            </div>
          </div>
        </div>

        <!-- Player Section -->
        <div id="player" class="player" style="display: none;">
          <h3 id="playerTitle">Now Playing</h3>
          <p id="playerArtist" style="color: #b3b3b3; margin-bottom: 1rem;"></p>
          <audio id="audio" controls></audio>
          <div class="player-controls">
            <button class="btn-small" onclick="toggleShuffle()">🔀 Shuffle</button>
            <button class="btn-small" onclick="toggleRepeat()">🔁 Repeat</button>
            <button class="btn-small" onclick="skipPrevious()">⏮ Prev</button>
            <button class="btn-small" onclick="skipNext()">Next ⏭</button>
            <input type="range" id="volumeControl" min="0" max="100" value="100" style="width: 150px; margin-left: auto;">
          </div>
        </div>

        <!-- Library Section -->
        <div id="library" class="section">
          <div class="section-title">Your Library</div>
          <div class="search-container">
            <input type="search" class="search-bar" id="searchInput" placeholder="Search tracks, artists, genres..." onkeyup="searchTracks()">
          </div>
          <div class="tracks-grid" id="tracksList"></div>
        </div>

        <!-- Favorites Section -->
        <div id="favorites" class="section">
          <div class="section-title">❤️ Liked Songs</div>
          <div class="tracks-grid" id="favoritesList"></div>
        </div>

        <!-- Recent Section -->
        <div id="recent" class="section">
          <div class="section-title">🕐 Recently Played</div>
          <div class="tracks-grid" id="recentList"></div>
        </div>

        <!-- Popular Section -->
        <div id="popular" class="section">
          <div class="section-title">🔥 Trending Now</div>
          <div class="tracks-grid" id="popularList"></div>
        </div>

        <!-- Playlists Section -->
        <div id="playlists" class="section">
          <div class="section-title">🎵 Playlists</div>
          <div class="upload-form" style="max-width: none; margin-bottom: 2rem;">
            <div class="form-group">
              <input type="text" id="playlistName" placeholder="Create new playlist">
              <button onclick="createPlaylist()" style="width: 100%;">Create</button>
            </div>
          </div>
          <div id="playlistsList"></div>
        </div>

        <!-- Queue Section -->
        <div id="queue" class="section">
          <div class="section-title">📋 Queue</div>
          <button onclick="clearQueue()" style="margin-bottom: 1.5rem;">Clear Queue</button>
          <div class="tracks-grid" id="queueList"></div>
        </div>
      </div>
    </div>
  </div>

  <script>
    let tracks = [];
    let favorites = [];
    let recentlyPlayed = [];
    let playlists = [];
    let queue = [];
    let currentTrack = null;
    let shuffle = false;
    let repeat = 0;

    const api = {
      upload: async (file, artist, title, genre) => {
        const form = new FormData();
        form.append('track', file);
        form.append('artist', artist);
        form.append('title', title);
        form.append('genre', genre);
        const res = await fetch('/api/upload', { method: 'POST', body: form });
        return res.json();
      },
      getTracks: async () => {
        const res = await fetch('/api/tracks');
        return res.json();
      },
      search: async (query) => {
        const res = await fetch(`/api/tracks/search/${query}`);
        return res.json();
      },
      getFavorites: async () => {
        const res = await fetch('/api/favorites');
        return res.json();
      },
      addFavorite: async (id) => {
        await fetch(`/api/favorites/${id}`, { method: 'POST' });
      },
      removeFavorite: async (id) => {
        await fetch(`/api/favorites/${id}`, { method: 'DELETE' });
      },
      getRecentlyPlayed: async () => {
        const res = await fetch('/api/recently-played');
        return res.json();
      },
      recordPlay: async (id) => {
        await fetch(`/api/played/${id}`, { method: 'POST' });
      },
      getMostPlayed: async () => {
        const res = await fetch('/api/most-played');
        return res.json();
      },
      getPlaylists: async () => {
        const res = await fetch('/api/playlists');
        return res.json();
      },
      createPlaylist: async (name) => {
        const res = await fetch('/api/playlists', { method: 'POST', headers: { 'Content-Type': 'application/json' }, body: JSON.stringify({ name }) });
        return res.json();
      },
      deletePlaylist: async (id) => {
        await fetch(`/api/playlists/${id}`, { method: 'DELETE' });
      },
      deleteTrack: async (id) => {
        await fetch(`/api/tracks/${id}`, { method: 'DELETE' });
      }
    };

    const renderTrackCard = (track, favorites) => `
      <div class="track-card">
        <div class="track-title">${track.title}</div>
        <div class="track-artist">${track.artist}</div>
        <div class="track-meta">${track.genre} • ${track.plays} plays</div>
        <div class="track-actions">
          <button class="btn-small" onclick="playTrack(${track.id})">▶ Play</button>
          <button class="btn-small btn-favorite ${favorites.includes(track.id) ? 'liked' : ''}" onclick="toggleFavorite(${track.id})">❤</button>
          <button class="btn-small" onclick="addToQueueUI(${track.id})">+ Queue</button>
          <button class="btn-small btn-delete" onclick="delTrack(${track.id})">Delete</button>
        </div>
      </div>
    `;

    const loadAllData = async () => {
      tracks = await api.getTracks();
      favorites = (await api.getFavorites()).map(t => t.id);
      recentlyPlayed = await api.getRecentlyPlayed();
      playlists = await api.getPlaylists();
      render();
    };

    const render = () => {
      const trackList = document.getElementById('tracksList');
      trackList.innerHTML = tracks.length === 0 ? '<div class="empty-state"><p>No tracks yet. Upload one to get started!</p></div>' : tracks.map(t => renderTrackCard(t, favorites)).join('');

      const favList = document.getElementById('favoritesList');
      const favTracks = tracks.filter(t => favorites.includes(t.id));
      favList.innerHTML = favTracks.length === 0 ? '<div class="empty-state"><p>No liked songs yet</p></div>' : favTracks.map(t => renderTrackCard(t, favorites)).join('');

      const recList = document.getElementById('recentList');
      recList.innerHTML = recentlyPlayed.length === 0 ? '<div class="empty-state"><p>Nothing played yet</p></div>' : recentlyPlayed.map(t => renderTrackCard(t, favorites)).join('');

      const popList = document.getElementById('popularList');
      const sorted = [...tracks].sort((a, b) => b.plays - a.plays).slice(0, 10);
      popList.innerHTML = sorted.length === 0 ? '<div class="empty-state"><p>No trending tracks</p></div>' : sorted.map(t => renderTrackCard(t, favorites)).join('');

      const plList = document.getElementById('playlistsList');
      plList.innerHTML = playlists.length === 0 ? '<div class="empty-state"><p>Create a playlist to get started</p></div>' : playlists.map(p => `
        <div class="playlist-item">
          <div><div class="playlist-name">${p.name}</div><div style="font-size: 0.8rem; color: #666;">${p.tracks.length} tracks</div></div>
          <div style="display: flex; gap: 0.5rem;"><button class="btn-small" onclick="viewPlaylist(${p.id})">View</button><button class="btn-small btn-delete" onclick="deletePlaylistUI(${p.id})">Delete</button></div>
        </div>
      `).join('');

      const qList = document.getElementById('queueList');
      const queueTracks = queue.map(id => tracks.find(t => t.id === id)).filter(Boolean);
      qList.innerHTML = queueTracks.length === 0 ? '<div class="empty-state"><p>Queue is empty</p></div>' : queueTracks.map(t => renderTrackCard(t, favorites)).join('');
    };

    window.switchTab = (tab) => {
      document.querySelectorAll('.section').forEach(s => s.classList.remove('active'));
      document.querySelectorAll('.nav-item').forEach(b => b.classList.remove('active'));
      document.getElementById(tab).classList.add('active');
      event.target.classList.add('active');
    };

    window.playTrack = async (id) => {
      const track = tracks.find(t => t.id === id);
      if (track) {
        currentTrack = track;
        document.getElementById('playerTitle').textContent = track.title;
        document.getElementById('playerArtist').textContent = track.artist;
        document.getElementById('audio').src = track.url;
        document.getElementById('player').style.display = 'block';
        document.getElementById('audio').play();
        await api.recordPlay(id);
        recentlyPlayed = await api.getRecentlyPlayed();
        render();
      }
    };

    window.toggleFavorite = async (id) => {
      if (favorites.includes(id)) {
        favorites = favorites.filter(f => f !== id);
        await api.removeFavorite(id);
      } else {
        favorites.push(id);
        await api.addFavorite(id);
      }
      render();
    };

    window.searchTracks = async () => {
      const query = document.getElementById('searchInput').value;
      if (query.length === 0) {
        render();
      } else {
        const results = await api.search(query);
        document.getElementById('tracksList').innerHTML = results.map(t => renderTrackCard(t, favorites)).join('');
      }
    };

    window.addToQueueUI = (id) => {
      if (!queue.includes(id)) {
        queue.push(id);
        alert('Added to queue');
      }
    };

    window.createPlaylist = async () => {
      const name = document.getElementById('playlistName').value;
      if (name) {
        await api.createPlaylist(name);
        document.getElementById('playlistName').value = '';
        playlists = await api.getPlaylists();
        render();
      }
    };

    window.deletePlaylistUI = async (id) => {
      await api.deletePlaylist(id);
      playlists = await api.getPlaylists();
      render();
    };

    window.delTrack = async (id) => {
      await api.deleteTrack(id);
      loadAllData();
    };

    window.clearQueue = () => {
      queue = [];
      render();
    };

    window.skipNext = () => {
      if (queue.length > 0) queue.shift();
      render();
    };

    window.skipPrevious = () => {
      if (currentTrack) playTrack(currentTrack.id);
    };

    window.toggleShuffle = () => {
      shuffle = !shuffle;
      event.target.style.opacity = shuffle ? '1' : '0.6';
    };

    window.toggleRepeat = () => {
      repeat = (repeat + 1) % 3;
      const labels = ['🔁', '🔂', '🔃'];
      event.target.textContent = labels[repeat] + ' Repeat';
    };

    document.getElementById('uploadBtn').onclick = async () => {
      const file = document.getElementById('file').files[0];
      if (!file) return alert('Pick a file');
      const btn = document.getElementById('uploadBtn');
      btn.disabled = true;
      btn.textContent = 'Uploading...';
      await api.upload(file, document.getElementById('artist').value, document.getElementById('title').value, document.getElementById('genre').value);
      document.getElementById('artist').value = '';
      document.getElementById('title').value = '';
      document.getElementById('genre').value = '';
      document.getElementById('file').value = '';
      btn.disabled = false;
      btn.textContent = 'Upload';
      await loadAllData();
    };

    document.getElementById('volumeControl').oninput = (e) => {
      document.getElementById('audio').volume = e.target.value / 100;
    };

    loadAllData();
  </script>
</body>
</html>
