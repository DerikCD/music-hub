<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Music Hub</title>
  <style>
    * {
      margin: 0;
      padding: 0;
      box-sizing: border-box;
    }
    body {
      font-family: system-ui, -apple-system, sans-serif;
      background: linear-gradient(135deg, #1e1e2e 0%, #2d2d44 100%);
      color: #e0e0e0;
      min-height: 100vh;
      padding: 20px;
    }
    .container {
      max-width: 800px;
      margin: 0 auto;
    }
    header {
      background: linear-gradient(135deg, #6d28d9 0%, #9333ea 100%);
      padding: 2rem;
      border-radius: 12px;
      text-align: center;
      margin-bottom: 2rem;
      color: white;
    }
    header h1 {
      font-size: 2rem;
      margin-bottom: 0.5rem;
    }
    .section {
      background: #2a2a3e;
      padding: 2rem;
      border-radius: 12px;
      margin-bottom: 2rem;
      border: 1px solid rgba(255, 255, 255, 0.1);
    }
    .section h2 {
      color: #a78bfa;
      margin-bottom: 1.5rem;
      font-size: 1.3rem;
    }
    .form-group {
      display: flex;
      flex-direction: column;
      gap: 1rem;
      margin-bottom: 1rem;
    }
    input[type="text"],
    input[type="file"] {
      padding: 0.75rem;
      border: 1px solid rgba(255, 255, 255, 0.2);
      border-radius: 6px;
      background: rgba(255, 255, 255, 0.05);
      color: #e0e0e0;
      font-size: 1rem;
    }
    input[type="text"]::placeholder {
      color: rgba(224, 224, 224, 0.5);
    }
    button {
      padding: 0.75rem 1.5rem;
      background: linear-gradient(135deg, #7c3aed 0%, #a855f7 100%);
      color: white;
      border: none;
      border-radius: 6px;
      cursor: pointer;
      font-weight: 600;
      font-size: 1rem;
      transition: all 0.3s;
    }
    button:hover {
      transform: translateY(-2px);
      box-shadow: 0 4px 12px rgba(168, 85, 247, 0.4);
    }
    button:disabled {
      opacity: 0.6;
      cursor: not-allowed;
    }
    .track-card {
      background: rgba(255, 255, 255, 0.03);
      padding: 1.25rem;
      border-radius: 8px;
      border: 1px solid rgba(255, 255, 255, 0.1);
      margin-bottom: 1rem;
      display: flex;
      justify-content: space-between;
      align-items: center;
      gap: 1rem;
    }
    .track-card:hover {
      background: rgba(255, 255, 255, 0.08);
      border-color: #a78bfa;
    }
    .track-info h3 {
      margin-bottom: 0.25rem;
      color: white;
    }
    .track-info p {
      font-size: 0.9rem;
      opacity: 0.7;
    }
    .track-actions {
      display: flex;
      gap: 0.5rem;
    }
    .btn-small {
      padding: 0.5rem 1rem;
      font-size: 0.9rem;
    }
    .btn-delete {
      background: rgba(239, 68, 68, 0.2);
      color: #fca5a5;
      border: 1px solid rgba(239, 68, 68, 0.5);
    }
    .btn-delete:hover {
      background: rgba(239, 68, 68, 0.3);
    }
    .empty {
      text-align: center;
      opacity: 0.6;
      padding: 2rem;
      font-style: italic;
    }
    .player {
      background: linear-gradient(135deg, #3730a3 0%, #4c1d95 100%);
      padding: 1.5rem;
      border-radius: 8px;
      margin-bottom: 1.5rem;
    }
    .player h3 {
      color: white;
      margin-bottom: 0.5rem;
    }
    audio {
      width: 100%;
      margin-top: 1rem;
    }
  </style>
</head>
<body>
  <div class="container">
    <header>
      <h1>🎵 Music Hub</h1>
      <p>Upload, share, and listen</p>
    </header>

    <div class="section">
      <h2>Upload Track</h2>
      <div class="form-group">
        <input type="text" id="artist" placeholder="Artist name">
        <input type="text" id="title" placeholder="Track title">
        <input type="file" id="file" accept="audio/*">
        <button id="uploadBtn">Upload</button>
      </div>
    </div>

    <div id="player" class="player" style="display: none;">
      <h3 id="playerTitle"></h3>
      <p id="playerArtist"></p>
      <audio id="audio" controls></audio>
    </div>

    <div class="section">
      <h2>Library</h2>
      <div id="tracksList"></div>
    </div>
  </div>

  <script>
    let tracks = [];
    let currentTrack = null;

    const api = {
      upload: async (file, artist, title) => {
        const form = new FormData();
        form.append('track', file);
        form.append('artist', artist);
        form.append('title', title);
        const res = await fetch('/api/upload', { method: 'POST', body: form });
        return res.json();
      },
      getTracks: async () => {
        const res = await fetch('/api/tracks');
        return res.json();
      },
      deleteTrack: async (id) => {
        await fetch(`/api/tracks/${id}`, { method: 'DELETE' });
      }
    };

    const loadTracks = async () => {
      tracks = await api.getTracks();
      render();
    };

    const render = () => {
      const list = document.getElementById('tracksList');
      if (tracks.length === 0) {
        list.innerHTML = '<p class="empty">No tracks yet. Upload one!</p>';
        return;
      }
      list.innerHTML = tracks.map(track => `
        <div class="track-card">
          <div class="track-info">
            <h3>${track.title}</h3>
            <p>${track.artist}</p>
          </div>
          <div class="track-actions">
            <button class="btn-small" onclick="playTrack(${track.id})">▶ Play</button>
            <button class="btn-small btn-delete" onclick="delTrack(${track.id})">Delete</button>
          </div>
        </div>
      `).join('');
    };

    window.playTrack = (id) => {
      const track = tracks.find(t => t.id === id);
      if (track) {
        currentTrack = track;
        document.getElementById('playerTitle').textContent = track.title;
        document.getElementById('playerArtist').textContent = track.artist;
        document.getElementById('audio').src = track.url;
        document.getElementById('player').style.display = 'block';
        document.getElementById('audio').play();
      }
    };

    window.delTrack = async (id) => {
      await api.deleteTrack(id);
      loadTracks();
    };

    document.getElementById('uploadBtn').onclick = async () => {
      const file = document.getElementById('file').files[0];
      if (!file) return alert('Pick a file');

      const btn = document.getElementById('uploadBtn');
      btn.disabled = true;
      btn.textContent = 'Uploading...';

      const artist = document.getElementById('artist').value;
      const title = document.getElementById('title').value;

      await api.upload(file, artist, title);
      
      document.getElementById('artist').value = '';
      document.getElementById('title').value = '';
      document.getElementById('file').value = '';
      btn.disabled = false;
      btn.textContent = 'Upload';

      await loadTracks();
    };

    loadTracks();
  </script>
</body>
</html>
